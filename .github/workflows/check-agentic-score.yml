# workflows/check-agentic-score.yml
#
# Start a fresh Is Agentic scan of ParadeDB and enforce a minimum score.

name: Check Is Agentic Score

on:
  schedule:
    # 9 AM PST (17:00 UTC), weekdays; 10 AM during PDT.
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: check-agentic-score
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCAN_API: https://is-agentic.com/api/scan/stream
  REPORT_API: https://is-agentic.com/api/v1/report
  SCAN_TARGET: https://paradedb.com
  REPORT_URL: https://is-agentic.com/scan/paradedb.com
  # Revisit when ParadeDB Cloud exposes a public API and OpenAPI specification.
  SCORE_THRESHOLD: "75"

jobs:
  check-agentic-score:
    name: Require Is Agentic score of at least 75
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run a fresh scan
        id: report
        shell: bash
        run: |
          scan_started_at=$(date -u +%s)
          # Reserve time within the job timeout for report polling and artifact upload.
          set +e
          curl --fail-with-body --silent --show-error --no-buffer \
            --max-time 600 \
            --get \
            --data-urlencode "target=$SCAN_TARGET" \
            --data-urlencode "force=1" \
            "$SCAN_API" > scan-events.sse
          curl_status=$?
          set -e

          if [[ $curl_status -ne 0 ]]; then
            {
              echo "status=error"
              echo "reason=The fresh Is Agentic scan failed or timed out."
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Is Agentic score check"
              echo "The fresh scan failed or timed out before returning a result."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Completion alone is provisional; the archive event contains the final result.
          if ! result=$(sed -n 's/^data: //p' scan-events.sse | \
            jq -esc 'map(select(.type == "scan_archived")) | last.result'); then
            {
              echo "status=error"
              echo "reason=The fresh Is Agentic scan did not return a valid archived result."
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          jq . <<< "$result" > scan-result.json

          if ! scanned_at=$(jq -er '.scannedAt | strings | select(length > 0)' <<< "$result") ||
             ! SCAN_STARTED_AT="$scan_started_at" SCANNED_AT="$scanned_at" node -e '
               const time = Date.parse(process.env.SCANNED_AT);
               process.exit(Number.isFinite(time) && time >= Number(process.env.SCAN_STARTED_AT) * 1000 ? 0 : 1);
             ' ||
             ! jq -e '.analysisStatus == "complete" and (.pendingChecks == [])' <<< "$result" > /dev/null; then
            {
              echo "status=error"
              echo "reason=The archived Is Agentic scan is invalid, incomplete, or stale."
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "scanned_at=$scanned_at" >> "$GITHUB_OUTPUT"

          # https://is-agentic.com/docs documents the report API and its scoring rubric.
          # Neither result.score nor the site-type variant score is the public report rating.
          # Require the same archived scan so an older healthy score cannot mask a regression.
          score=""
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 \
              --get --data-urlencode "url=$SCAN_TARGET" \
              --header "Cache-Control: no-cache" \
              "$REPORT_API" -o scan-report.json; then
              if score=$(jq -er --arg scanned_at "$scanned_at" --arg target "$SCAN_TARGET" '
                select(.scanned_at == $scanned_at and .target == $target)
                | .score | numbers | select(. >= 0 and . <= 100 and . == floor)
              ' scan-report.json); then
                break
              fi
            fi
            score=""
            if (( attempt < 12 )); then sleep 5; fi
          done

          if [[ -z "$score" ]]; then
            {
              echo "status=error"
              echo "reason=The Is Agentic report API did not return a valid score for the archived scan."
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Keep the public page for diagnostics only; it can lag behind the report API.
          report_warning=""
          if curl --fail --silent --show-error --max-time 20 \
            --header "Cache-Control: no-cache" \
            "$REPORT_URL" -o scan-report.html; then
            if ! SCANNED_AT="$scanned_at" node -e '
              const fs = require("node:fs");
              const html = fs.readFileSync("scan-report.html", "utf8");
              for (const match of html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)) {
                let data;
                try { data = JSON.parse(match[1]); } catch { continue; }
                const graph = Array.isArray(data["@graph"]) ? data["@graph"] : [data];
                if (graph.some(item => item["@type"] === "WebPage" &&
                    Date.parse(item.dateModified) >= Date.parse(process.env.SCANNED_AT))) process.exit(0);
              }
              process.exit(1);
            '; then
              report_warning="The public report page is stale or has no valid timestamp; the score comes from the archived scan via the report API."
            fi
          else
            report_warning="The public report page could not be fetched; the score comes from the archived scan via the report API."
          fi
          if [[ -n "$report_warning" ]]; then
            echo "::warning::$report_warning"
          fi

          {
            echo "score=$score"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Is Agentic score check"
            echo ""
            echo "| Score | Minimum | Latest scan |"
            echo "| ---: | ---: | --- |"
            echo "| [$score/100]($REPORT_URL) | $SCORE_THRESHOLD/100 | $scanned_at |"
            echo ""
            echo "Source: the report API, matched to the completed archived scan."
            if [[ -n "$report_warning" ]]; then
              echo ""
              echo "Warning: $report_warning"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( score < SCORE_THRESHOLD )); then
            {
              echo "status=regressed"
              echo "reason=Score regressed to $score/100 (minimum: $SCORE_THRESHOLD/100)."
            } >> "$GITHUB_OUTPUT"
            echo "::error::Is Agentic score is $score/100; expected at least $SCORE_THRESHOLD/100."
            exit 1
          fi

          {
            echo "status=healthy"
            echo "reason=Score is $score/100 (minimum: $SCORE_THRESHOLD/100)."
          } >> "$GITHUB_OUTPUT"
          echo "Is Agentic score is $score/100."

      - name: Upload scan details
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentic-scan-details
          path: |
            scan-events.sse
            scan-result.json
            scan-report.html
            scan-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build Slack failure payload
        if: always() && (steps.report.outputs.status == 'regressed' || steps.report.outputs.status == 'error')
        env:
          MONITOR_STATUS: ${{ steps.report.outputs.status }}
          MONITOR_REASON: ${{ steps.report.outputs.reason }}
          SCANNED_AT: ${{ steps.report.outputs.scanned_at }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node > agentic-score-payload.json <<'NODE'
          process.stdout.write(JSON.stringify({
            text: "🚨 ParadeDB's Is Agentic score needs attention - <!subteam^S0BLL9VCQ4A|@cloud-maintainers>",
            attachments: [{
              color: "danger",
              fields: [
                { title: "Status", value: process.env.MONITOR_STATUS, short: true },
                { title: "Repository", value: process.env.REPO, short: true },
                { title: "Details", value: process.env.MONITOR_REASON, short: false },
                { title: "Latest Scan", value: process.env.SCANNED_AT || "Unavailable", short: false },
                { title: "Report", value: "<https://is-agentic.com/scan/paradedb.com|View report>", short: true },
                { title: "Logs", value: `<${process.env.RUN_URL}|View workflow run>`, short: true }
              ]
            }]
          }))
          NODE

      - name: Ping Slack on regression
        if: always() && (steps.report.outputs.status == 'regressed' || steps.report.outputs.status == 'error')
        uses: paradedb/actions/slack-alert@v13
        with:
          webhook_url: ${{ secrets.SLACK_GITHUB_CHANNEL_WEBHOOK_URL }}
          payload_file: agentic-score-payload.json
